[package]
name = "jet-tauri"
# One release version with the core (ADR-0053): `just version-check` fails
# unless this, tauri.conf.json and package.json equal packages/Cargo.toml's.
version = "0.2.0"
description = "Jet desktop client for Linux"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jet_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
jet-client = { path = "../../../packages/jet-client" }
jet-protocol = { path = "../../../packages/jet-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# This computer's Ed25519 client identity for remote Planes (ADR-0017). The
# seed stays native: in Secret Service, or in memory for session-only pairing.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
# Seed and probe-secret generation without rand_core.
getrandom = "0.4"
# Authentication strings and key fingerprints (SHA-256 over public bytes and
# the pairing transcript only; raw digest bytes, never hex `Display`).
sha2 = "0.11"
# Wipes seeds, retained claim codes and secret-store buffers.
zeroize = "1"
# `process` spawns the system ssh for remote Planes.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2"
# Signed app updates from the GitHub release (`jet/updates.rs`). Registered
# only when the release configuration has `plugins.updater`; the webview gets
# no updater permission. Linux bundles are the raw deb/rpm/AppImage, so the
# v1 `zip` archives and the Windows/macOS system proxy are not needed.
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["rustls-tls"] }
# Orders bundled and installed core versions (`jet/local_service`); already
# in the graph through Tauri.
semver = "1"

# Freedesktop Secret Service for the pairing key (ADR-0076). The async-io
# runtime feature adds no zbus feature beyond what notify-rust already
# enables, so desktop notifications keep the same zbus runtime.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "3"

# Release bundles (`just release-bundle`). Size first: a single optimized,
# link-time-optimized unit, stripped of symbols. `panic` stays `unwind`: the
# shell maps a panicked `spawn_blocking` file write or spawned task to an
# error through its `JoinError` instead of losing the whole app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

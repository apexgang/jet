# This workflow is managed by gh actions-lock.
# The v1 release contract's test gate (issue #58): the ordinary suite, the
# lints, the migration conventions, and the dependency envelope on both
# supported core platforms (ADR-0032). Reference performance and idle
# resource measurements run on the fixed reference hosts instead, through
# `just budget-test` and `just resource-test`.
name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select checks
        id: changes
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/changes.py
      - name: Test automation
        working-directory: .
        run: python3 -m unittest discover -s .github/tests -v

  test:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
      - name: Set up Rust
        working-directory: .
        run: bash .github/scripts/setup-rust.sh test
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: packages
          shared-key: core
          key: ${{ hashFiles('packages/**/*.rs', 'packages/**/*.sql', 'packages/**/.sqlx/*.json', 'packages/**/contracts/**', 'docs/conformance-matrix.md') }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Check migration conventions
        run: just sqlx-migrations-check
      - name: Check the dependency seams and release profiles
        run: just release-envelope
      - name: Install clippy for the pinned toolchain
        run: rustup component add clippy
      - name: Lint
        run: just clippy -- -D warnings
      - name: Run the suite
        run: just test --locked

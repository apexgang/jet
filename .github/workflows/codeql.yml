# Actions are pinned to full commit SHAs (repository policy); the comment
# names the release tag each SHA was verified against.
# CodeQL code scanning for every language in the repository (issue #176).
#
# GitHub's default setup cannot analyze the Swift GUI: the Xcode project
# uses file system synchronized folders (Xcode 16 and later), so the Swift
# autobuilder finds no target with Swift sources and gives up. Advanced setup
# replaces default setup for every language, because code scanning rejects
# CodeQL uploads from a workflow while default setup is enabled. The Swift
# job compiles the Xcode GUI and the Swift wire models itself under the
# CodeQL tracer; `.github/tests/test_automation.py` keeps that build step
# covering every Swift source root. Unlike the test workflows, nothing here
# is gated on the `changes` job: a scan of the whole tree is the point, and
# no analysis is a required check.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest
          - language: python
            build-mode: none
            os: ubuntu-latest
          - language: rust
            build-mode: none
            os: ubuntu-latest
          - language: swift
            build-mode: manual
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: matrix.language == 'swift'
      - name: Compile the Xcode GUI for macOS under the CodeQL tracer
        if: matrix.language == 'swift'
        run: >
          xcodebuild build -project apps/jet/jet.xcodeproj -target jet
          -configuration Debug -sdk macosx
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          DEVELOPMENT_TEAM="" ARCHS="$(uname -m)"
      - name: Compile the Swift wire models under the CodeQL tracer
        if: matrix.language == 'swift'
        working-directory: packages
        run: just contracts-test-swift
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}

# This workflow is managed by gh actions-lock.
name: Release core executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and tap updates, including retries. Never cancel a release.
concurrency:
  group: core-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require a version tag matching the workspace
        env:
          APP_KEY: ${{ secrets.APE_BONKER_PRIVATE_KEY || secrets.RELEASE_APP_CLIENT_KEY }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 .github/scripts/release_assets.py --tag "$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" != *-* && -z "$APP_KEY" ]]; then
            echo 'Configure APE_BONKER_PRIVATE_KEY before releasing.' >&2
            exit 1
          fi

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            label: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            label: aarch64-unknown-linux-gnu
          - runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            label: universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages
    env:
      TARGETS: ${{ matrix.targets }}
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@v4.0.0
      - name: Set up Rust
        working-directory: .
        run: bash .github/scripts/setup-rust.sh release
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: packages
          shared-key: release-${{ matrix.label }}
          key: ${{ hashFiles('packages/**/*.rs', 'packages/**/*.sql', 'packages/**/.sqlx/*.json', 'packages/**/contracts/**', 'docs/conformance-matrix.md') }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Install targets
        run: |
          for target in $TARGETS; do rustup target add "$target"; done
      - name: Build, split symbols, strip, and package
        run: |
          args=()
          for target in $TARGETS; do args+=(--target "$target"); done
          just release-package "${args[@]}"
      - name: Gate sizes, dependency seams, and profiles
        run: just release-check --target "$LABEL"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: jet-core-${{ matrix.label }}
          path: packages/target/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: jet-core-*
          merge-multiple: true
          path: packages/target/dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh

  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # ASVS 13.3.1/13.3.2: keep the key in Actions secrets and mint only
      # contents:write for the tap. The action revokes the token after the job.
      - uses: actions/create-github-app-token@v3.2.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || 'Iv23liPckhcRTwkS6Yxe' }}
          private-key: ${{ secrets.APE_BONKER_PRIVATE_KEY || secrets.RELEASE_APP_CLIENT_KEY }}
          owner: apexgang
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          repository: apexgang/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ steps.app.outputs.token }}
      - name: Update the binary formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/update-homebrew.sh

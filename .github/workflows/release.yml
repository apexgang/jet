# Actions are pinned to full commit SHAs (repository policy); the comment
# names the release tag each SHA was verified against.
name: Release core executables and the Linux desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize retries of one tag without cancelling another version's build.
concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a version tag matching the workspace and the desktop app
        env:
          HAS_APP_KEY: ${{ secrets.APE_BONKER_PRIVATE_KEY != '' }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 .github/scripts/release_assets.py --tag "$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" != *-* && "$HAS_APP_KEY" != true ]]; then
            echo 'Configure APE_BONKER_PRIVATE_KEY before releasing.' >&2
            exit 1
          fi
          # Every release, prereleases included, signs its desktop bundles and
          # publishes their signatures in the updater manifest.
          if [[ "$HAS_UPDATER_KEY" != true ]]; then
            echo 'Configure TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD before releasing.' >&2
            exit 1
          fi

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            label: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            label: aarch64-unknown-linux-gnu
          - runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            label: universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages
    env:
      TARGETS: ${{ matrix.targets }}
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Set up Rust
        working-directory: .
        run: bash .github/scripts/setup-rust.sh release
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/target
            !packages/target/dist
            .github/.cache
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.label }}-${{ hashFiles('packages/rust-toolchain.toml', 'packages/.cargo/config.toml', '.github/ci/cargo.toml') }}-${{ hashFiles('packages/**', 'docs/conformance-matrix.md') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.label }}-${{ hashFiles('packages/rust-toolchain.toml', 'packages/.cargo/config.toml', '.github/ci/cargo.toml') }}-
      - name: Restore unchanged source timestamps
        working-directory: .
        run: python3 .github/scripts/cache_sources.py restore
      - name: Install targets
        run: |
          for target in $TARGETS; do rustup target add "$target"; done
      - name: Build, split symbols, strip, and package
        run: |
          args=()
          for target in $TARGETS; do args+=(--target "$target"); done
          just release-package "${args[@]}"
      - name: Gate sizes, dependency seams, and profiles
        run: just release-check --target "$LABEL"
      - name: Save source timestamps
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        working-directory: .
        run: python3 .github/scripts/cache_sources.py save
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/target
            !packages/target/dist
            .github/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: jet-core-${{ matrix.label }}
          path: packages/target/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Bundles the Linux desktop app around the unmodified core payloads above,
  # signed for the updater.
  desktop-linux:
    needs: package
    uses: ./.github/workflows/desktop-linux.yml
    with:
      sign: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # Installs this release's formula and cask from a local tap before anything
  # is published.
  homebrew-check:
    needs: [package, desktop-linux]
    uses: ./.github/workflows/homebrew-check.yml

  # Drives the signed x86_64 .deb through the desktop journey before anything
  # is published. Its measurements are informational; its checks gate.
  desktop-e2e:
    needs: desktop-linux
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      signed: true
      labels: '["x86_64-unknown-linux-gnu"]'

  publish:
    needs: [package, desktop-linux, homebrew-check, desktop-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A published release keeps its assets, so a rerun after the artifacts
      # expire downloads nothing and only checks GitHub's Latest.
      - name: Check whether the release is published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh --check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.release.outputs.published != 'true' }}
        with:
          pattern: jet-core-*
          merge-multiple: true
          path: packages/target/dist
      # publish-release.sh reads the bundles from here, apart from the core's
      # exact archive set.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.release.outputs.published != 'true' }}
        with:
          pattern: jet-desktop-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/jet-desktop
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh

  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap-jet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ASVS 13.3.1/13.3.2: keep the key in Actions secrets and mint only
      # contents:write for the tap. The action revokes the token after the job.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || 'Iv23liPckhcRTwkS6Yxe' }}
          private-key: ${{ secrets.APE_BONKER_PRIVATE_KEY }}
          owner: apexgang
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apexgang/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ steps.app.outputs.token }}
      # Brings Formula/jet.rb and Casks/jet-app.rb to the highest published
      # stable release, which need not be this tag: this group keeps one
      # pending job and cancels the older one. The Swift app's release
      # writes Casks/jet.rb, and Formula/jet.rb for a newer core, under its own
      # concurrency group; the script rebases onto its commits before pushing.
      - name: Update the core formula and the Linux desktop cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/update-homebrew.sh

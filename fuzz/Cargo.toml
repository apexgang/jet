[package]
name = "jet-protocol-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jet-protocol = { path = "../packages/jet-protocol" }
libfuzzer-sys = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "rt"] }

[workspace]

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

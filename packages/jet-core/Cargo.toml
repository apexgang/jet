[package]
name = "jet-core"
description = "Jet core: Command, Query, and Event interfaces over the Plane store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
age.workspace = true
tempfile.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
jet-store.workspace = true
jet-runtime.workspace = true
rustix.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
trash.workspace = true
hex.workspace = true
jiff.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

# The platform credential store is spoken to through its own API: the
# freedesktop Secret Service over D-Bus, the macOS Keychain through the
# Security framework (ADR-0076).
[target.'cfg(not(target_os = "macos"))'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

# Tests serve a Secret Service of their own over a private socket.
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }

[lints]
workspace = true

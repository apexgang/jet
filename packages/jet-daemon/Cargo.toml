[package]
name = "jet-daemon"
description = "jetd: the authoritative Jet daemon for one Plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek.workspace = true
rustix.workspace = true
getrandom.workspace = true
clap.workspace = true
jet-core.workspace = true
jet-client.workspace = true
jet-protocol.workspace = true
jet-runtime.workspace = true
jet-store.workspace = true
# Named only to compile dependency log call sites out of release builds.
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Named only to compile dependency tracing call sites out of release builds.
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
jet-craft-sdk.workspace = true
hex.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

# Tests serve a Secret Service of their own for the Plane under test.
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }

[lints]
workspace = true

[[bin]]
name = "jetd"
path = "src/main.rs"

# Accepted declaration for the bundled Codex Craft. An installation compares
# this document with the one it accepted before sending a Command, so the
# executable named here is exactly the one its helper will launch.
id = "codex"
harness = "codex"
schema = { major = 1, minor = 0 }
broker_permissions = []
host_access = [
    { kind = "filesystem", path = "Harness-native user extension configuration, caches, and explicitly selected native source checkouts" },
    { kind = "network", destination = "Harness-native configured extension sources" },
	# Run launch uses the first executable as the Harness program.
	{ kind = "executable", name = "codex" },
	{ kind = "executable", name = "git" },
	{ kind = "executable", name = "curl" },
	{ kind = "network", destination = "api.openai.com" },
	{ kind = "network", destination = "chatgpt.com" },
]
features = [
    { name = "extensions" },
    { name = "utility" },
    { name = "review" },
	{ name = "turns", required = true },
	{ name = "actions", required = true },
]

[protocol]
family = "craft"
versions = [{ major = 1, minor = 8 }]
capabilities = ["runs", "actions"]

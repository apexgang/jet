# Accepted declaration for the bundled Claude Code Craft. An installation
# compares this document with the one it accepted before sending a Command,
# so the executable named here is exactly the one its helper will launch.
id = "claude-code"
harness = "claude-code"
schema = { major = 1, minor = 0 }
broker_permissions = ["remote_tools"]
host_access = [
    { kind = "filesystem", path = "Harness-native user extension configuration, caches, and explicitly selected native source checkouts" },
    { kind = "network", destination = "Harness-native configured extension sources" },
	# Run launch uses the first executable as the Harness program.
	{ kind = "executable", name = "claude" },
	{ kind = "executable", name = "git" },
	{ kind = "executable", name = "curl" },
	{ kind = "network", destination = "api.anthropic.com" },
]
features = [
    { name = "extensions" },
    { name = "remote_tools" },
    { name = "utility" },
    { name = "review" },
	{ name = "turns", required = true },
	{ name = "actions", required = true },
	{ name = "resume" },
]

[protocol]
family = "craft"
versions = [{ major = 1, minor = 8 }]
capabilities = ["runs", "resume", "actions"]

[workspace]
resolver = "3"
members = [
	"jet-client",
	"jet-core",
	"jet-craft-claude",
	"jet-craft-codex",
	"jet-craft-sdk",
	"jet-daemon",
	"jet-fueld",
	"jet-protocol",
	"jet-runtime",
	"jet-store",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
jet-client = { path = "jet-client" }
jet-core = { path = "jet-core" }
jet-craft-sdk = { path = "jet-craft-sdk" }
jet-protocol = { path = "jet-protocol" }
jet-runtime = { path = "jet-runtime" }
jet-store = { path = "jet-store" }

clap = { version = "4", features = ["derive"] }
pretty_assertions = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
	"io-util",
	"macros",
	"net",
	"process",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
opt-level = "z"
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.release]
opt-level = "z"
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

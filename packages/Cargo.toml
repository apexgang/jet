[workspace]
resolver = "3"
members = [
	"client",
	"core",
	"craft-claude",
	"craft-codex",
	"craft-sdk",
	"daemon",
	"fueld",
	"protocol",
	"runtime",
	"store",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
jet-client = { path = "client" }
jet-core = { path = "core" }
jet-craft-sdk = { path = "craft-sdk" }
jet-protocol = { path = "protocol" }
jet-runtime = { path = "runtime" }
jet-store = { path = "store" }

clap = { version = "4", features = ["derive"] }
pretty_assertions = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
	"io-util",
	"macros",
	"net",
	"process",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"

# Development profile used for all local checks and tests.
[profile.jet-dev]
inherits = "dev"

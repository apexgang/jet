[workspace]
resolver = "3"
members = [
	"jet-client",
	"jet-core",
	"jet-craft-claude",
	"jet-craft-codex",
	"jet-craft-sdk",
	"jet-daemon",
	"jet-fueld",
	"jet-protocol",
	"jet-protocol-fuzz",
	"jet-runtime",
	"jet-store",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false }
jet-client = { path = "jet-client" }
jet-core = { path = "jet-core" }
jet-craft-sdk = { path = "jet-craft-sdk" }
jet-protocol = { path = "jet-protocol" }
jet-runtime = { path = "jet-runtime" }
jet-store = { path = "jet-store" }

# Colored output and "did you mean" suggestions are dropped (ADR-0059): the
# executables are driven by the GUI, service managers and SSH, not typed at.
clap = { version = "4", default-features = false, features = [
	"derive",
	"error-context",
	"help",
	"std",
	"usage",
] }
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
libfuzzer-sys = "0.4"
# Jet installs no `log` logger and no `tracing` subscriber, so every record
# its dependencies emit is dropped at run time. Release builds compile the
# call sites out instead (ADR-0059); `jet-daemon` names these only for that.
log = { version = "0.4", features = ["release_max_level_off"] }
pretty_assertions = "1"
# rustls with the ring provider rather than reqwest's aws-lc-rs default, which
# links the aws-lc C library into `jetd` (ADR-0054); the platform verifier
# stays. ring offers no post-quantum key exchange (X25519MLKEM768), a
# trade-off still pending in docs/core-distribution.md. `jetd` installs the
# provider at startup through `jet-core`'s `https` module.
reqwest = { version = "0.13.4", default-features = false, features = [
	"rustls-no-provider",
] }
filedescriptor = "0.8.3"
portable-pty = "0.9.0"
rustix = { version = "1", features = ["fs", "process"] }
# 0.23.45 fixes RUSTSEC-2026-0285: TLS 1.3 handshake messages were accepted
# across encryption-level boundaries.
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", features = ["raw_value", "uuid1"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
trash = { version = "5.2", default-features = false }
sqlx = { version = "0.9", default-features = false, features = [
	"macros",
	"migrate",
	"runtime-tokio",
	"sqlite-bundled",
] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = [
	"release_max_level_off",
] }
toml_edit = { version = "0.25.13", features = ["serde"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = [
	"fs",
	"io-std",
	"io-util",
	"macros",
	"net",
	"process",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Schedules resolve IANA zones against the compact TZif database bundled into
# jetd, never the host's zoneinfo, so every Plane selects the same instants
# (ADR-0080).
jiff = { version = "0.2.37", default-features = false, features = [
	"std",
	"tzdb-bundle-always",
] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
# The Secret Service is spoken to over the session bus in process (ADR-0076);
# the tokio integration alone, so no second executor is linked.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
opt-level = "z"
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

# Release profiles by role (ADR-0059). `jetd` balances speed and size with
# thin LTO; `jetfueld` and the bundled Crafts take the size-first profile.
# Both keep line tables and leave symbols in place so `just release-package`
# can split them into separate crash-symbol artifacts before stripping.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
strip = "none"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"

[workspace]
resolver = "3"
members = [
	"jet-client",
	"jet-core",
	"jet-craft-claude",
	"jet-craft-codex",
	"jet-craft-sdk",
	"jet-daemon",
	"jet-fueld",
	"jet-protocol",
	"jet-protocol-fuzz",
	"jet-runtime",
	"jet-store",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
age = { version = "=0.11.3", default-features = false }
jet-client = { path = "jet-client" }
jet-core = { path = "jet-core" }
jet-craft-sdk = { path = "jet-craft-sdk" }
jet-protocol = { path = "jet-protocol" }
jet-runtime = { path = "jet-runtime" }
jet-store = { path = "jet-store" }

clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
getrandom = "0.4"
libfuzzer-sys = "0.4"
pretty_assertions = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
filedescriptor = "0.8.3"
portable-pty = "0.9.0"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", features = ["raw_value", "uuid1"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
trash = { version = "5.2", default-features = false }
sqlx = { version = "0.9", default-features = false, features = [
	"macros",
	"migrate",
	"runtime-tokio",
	"sqlite-bundled",
] }
subtle = "2"
tempfile = "3"
thiserror = "2"
toml_edit = { version = "0.25.13", features = ["serde"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = [
	"fs",
	"io-std",
	"io-util",
	"macros",
	"net",
	"process",
	"rt-multi-thread",
	"signal",
	"sync",
	"time",
] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
opt-level = "z"
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

# Release profiles by role (ADR-0059). `jetd` balances speed and size with
# thin LTO; `jetfueld` and the bundled Crafts take the size-first profile.
# Both keep line tables and leave symbols in place so `just release-package`
# can split them into separate crash-symbol artifacts before stripping.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
strip = "none"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
